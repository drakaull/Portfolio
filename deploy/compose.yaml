# Production stack: Caddy (web) -> backend (API) -> db (PostgreSQL). See docs/deployment.md.
# Run from this folder: docker compose up -d --build
# Settings and secrets come from ./.env (copy .env.example), which never goes into git.
name: portfolio-site # distinct from the dev stack (docker-compose.yml at the root)

# Container logs are rotated: without a limit they would slowly fill the small server's disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  caddy:
    logging: *logging
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    # The only published ports. HTTP_PORT / HTTPS_PORT are changed only to test on a PC.
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp" # HTTP/3
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
      SITE_URL: ${SITE_URL:?set SITE_URL in .env}
      REDIRECT_ADDRESSES: ${REDIRECT_ADDRESSES:?set REDIRECT_ADDRESSES in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - caddy-data:/data # HTTPS certificates: keep them, Let's Encrypt limits new ones
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - web

  backend:
    logging: *logging
    build: ../backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://portfolio:${POSTGRES_PASSWORD}@db:5432/portfolio
      STORAGE_DIR: /app/storage
      # Trust X-Forwarded-For only from the private "web" network, where only Caddy talks to it.
      FORWARDED_ALLOW_IPS: 172.30.10.0/24,fd30:10::/64
    volumes:
      - storage:/app/storage # CV and photo
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - web
      - data

  db:
    logging: *logging
    image: postgres:17.10-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_DB: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - data

networks:
  web:
    # IPv6 too: otherwise Docker relays IPv6 visitors through docker-proxy, which hides their
    # address behind the network gateway (every visitor would look like 172.30.10.1).
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.30.10.0/24
        - subnet: fd30:10::/64
  # No route to the Internet: the database talks to the backend only.
  data:
    internal: true

volumes:
  db-data:
  storage:
  caddy-data:
  caddy-config:
