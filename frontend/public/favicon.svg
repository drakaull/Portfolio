<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- "LF" monogram drawn with rectangles, so it stays crisp at 16 px without any font. -->
  <rect width="32" height="32" rx="7" fill="#9b4527"/>
  <g fill="#fbf8f2">
    <rect x="6" y="8" width="3.5" height="16"/>
    <rect x="6" y="20.5" width="8" height="3.5"/>
    <rect x="17" y="8" width="3.5" height="16"/>
    <rect x="17" y="8" width="9" height="3.5"/>
    <rect x="17" y="14.5" width="7" height="3.2"/>
  </g>
</svg>
