<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio</title>
    <!-- SVG for modern browsers, .ico for the others; the PNGs are home-screen icons. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Mobile browser bar in the page background colour of each theme (--color-bg). -->
    <meta name="theme-color" content="#f7f4ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1a17" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the theme before the first paint to avoid a flash of the wrong theme.
      try {
        const stored = localStorage.getItem('theme')
        const prefersDark = matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = stored || (prefersDark ? 'dark' : 'light')
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
